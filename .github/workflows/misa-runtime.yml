name: MisaTV runtime fixture
on:
  pull_request:
    paths:
      - "runtime/misa-py/**"
      - "runtime/misa-js/**"
      - "runtime/fixtures/js/**"
      - "runtime/misa-jar/**"
      - "scripts/runtime-check.mjs"
      - "scripts/runtime-selftest.mjs"
      - ".github/workflows/misa-runtime.yml"
  push:
    branches: [feat/misatv-runtime-validation]
    paths:
      - "runtime/misa-py/**"
      - "runtime/misa-js/**"
      - "runtime/fixtures/js/**"
      - "runtime/misa-jar/**"
      - "scripts/runtime-check.mjs"
      - "scripts/runtime-selftest.mjs"
      - ".github/workflows/misa-runtime.yml"
permissions:
  contents: read
jobs:
  py-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build isolated MisaTV Py runtime
        run: docker build -t tvbox-agg/misa-py:3.11 runtime/misa-py
      - name: Execute Python source fixture in no-network sandbox
        run: |
          node scripts/runtime-check.mjs --kind py --source runtime/fixtures/py/home.py > /tmp/py-result.json
          node -e "const r=require('/tmp/py-result.json'); if(r.status!=='runtime-home') { console.error(r); process.exit(1) }"
      - name: Execute bundled Python ZIP fixture
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/spider.zip','w'); z.write('runtime/fixtures/py/home.py','home.py'); z.close()"
          node scripts/runtime-check.mjs --kind py --archive /tmp/spider.zip --entry home.py > /tmp/py-zip-result.json
          node -e "const r=require('/tmp/py-zip-result.json'); if(r.status!=='runtime-home') { console.error(r); process.exit(1) }"

      - name: Verify runtime adapter argument contracts
        run: |
          node --check scripts/runtime-check.mjs
          node scripts/runtime-selftest.mjs
  jar-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated MisaTV desktop JVM runtime
        run: docker build -t tvbox-agg/misa-jar:17 runtime/misa-jar
      - name: Execute fixture through MisaTV SpiderHost
        run: |
          node scripts/runtime-check.mjs --kind jar --fixture --class com.github.catvod.spider.RuntimeFixture > /tmp/jar-result.json
          node -e "const r=require('/tmp/jar-result.json'); if(r.status!=='runtime-home') { console.error(r); process.exit(1) }"
  js-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated QuickJS runtime with MisaTV bootstrap
        run: docker build -t tvbox-agg/misa-js:quickjs runtime/misa-js
      - name: Execute fixture through QuickJS and MisaTV bootstrap
        run: |
          node scripts/runtime-check.mjs --kind js --source runtime/fixtures/js/home.js > /tmp/js-result.json
          node -e "const r=require('/tmp/js-result.json'); const v=r.data?.list?.[0]; if(r.status!=='runtime-home' || v?.digest!=='5d41402abc4b2a76b9719d911017c592' || v?.local_bridge!=='persisted') { console.error(r); process.exit(1) }"
          node scripts/runtime-check.mjs --kind js --source runtime/fixtures/js/commonjs.js > /tmp/js-cjs-result.json
          node -e "const r=require('/tmp/js-cjs-result.json'); if(r.status!=='runtime-home' || r.data?.list?.[0]?.vod_id!=='cjs-1') { console.error(r); process.exit(1) }"
          node scripts/runtime-check.mjs --kind js --source runtime/fixtures/js/esm.js > /tmp/js-esm-result.json
          node -e "const r=require('/tmp/js-esm-result.json'); if(r.status!=='runtime-home' || r.data?.list?.[0]?.vod_id!=='esm-1') { console.error(r); process.exit(1) }"
