name: Apply Strict Filter
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and commit
        run: |
          python3 << 'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path("scripts/.strict-payload")
          m = json.loads((root / "manifest.json").read_text())
          def rebuild(prefix, n):
              b64 = "".join((root / f"{prefix}.{i:02d}.b64").read_text() for i in range(n))
              data = gzip.decompress(base64.b64decode(b64))
              assert hashlib.md5(data).hexdigest() == m[f"{prefix}_md5"], prefix
              return data
          deep = rebuild("deep", m["deep"])
          pipe = rebuild("pipe", m["pipe"])
          Path("scripts/deepcheck.mjs").write_bytes(deep)
          Path("scripts/pipeline.mjs").write_bytes(pipe)
          print("OK", len(deep), len(pipe))
          PY
          git config user.name "thevip001"
          git config user.email "max1396842@gmail.com"
          git add scripts/deepcheck.mjs scripts/pipeline.mjs
          git commit -m "strict filter: content + search results; kill uncertain under strict" || echo "no change"
          git push
