name: 每日聚合接口

# 你原来的仓库里没有这个文件，所以「每天自动运行」从来没有真正发生过。
# 这个工作流补上这一环：每天北京时间 04:00 自动跑一次并提交产物。

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  # 改了脚本/配置就自动跑一次验证，不用去网页点 Run workflow。
  # 只监听代码路径：机器人提交的产物（聚合接口/、data/）不在列表里，不会自我循环。
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      strictness:
        description: "剔除策略：strict(只留快站) / balanced(死站删、慢站留文末) / loose(只删死站)"
        required: false
        type: choice
        options: [strict, balanced, loose]
        default: strict
      no_collect:
        description: "跳过上游收集，只用已有池子"
        required: false
        type: boolean
        default: false
      max_candidates:
        description: "本轮最多抓多少候选接口（默认 600）"
        required: false
        type: string
        default: "600"

# 与其他写仓库的任务互斥，避免 push 打架
concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 不需要 npm install：脚本零第三方依赖
      - name: 语法自检
        run: |
          for f in scripts/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "✅ 全部脚本语法通过"

      - name: 运行每日聚合
        env:
          # ---- 剔除策略 ----
          # 定时触发时 github.event.inputs 是空的，会走默认值 strict
          STRICTNESS: ${{ github.event.inputs.strictness || 'strict' }}
          # 判慢只看首字节（TTFB），不看吞吐
          SLOW_TTFB_MS: "1500"        # 首字节超过 1.5 秒判为慢（strict 下剔除）
          FAST_TTFB_MS: "300"         # 低于 0.3 秒算精选
          FAST_TTFB_CJ_MS: "800"      # 采集站（type 0/1）精选阈值放宽到 0.8 秒（cms 后端首字节天然慢）
          CRAWLER_SLOW_TTFB_MS: "3000"  # 内置爬虫站测的是网站首页，放宽到 3 秒
          KEEP_UNPROBED: "0"          # 预算用尽没测到的站按无效剔除（标 unsure 后统一剔除）
          MAX_FAILS: "3"              # 连续失败 3 轮才永久剔除
          # ---- 深度体检：探活通过 ≠ 点开能用（学 MisaTV 的源体检）----
          #  采集站：解析结构化数据，有分类必须能刷出条目（旧版会放过 {"code":0,"list":[]} 空壳）
          #  Jar 站：解包 jar 看 dex 里有没有 csp_XXX 对应的类（否则 TVBox 一加载就 ClassNotFoundException）
          #  规则站：把 ext 规则拉下来，规则里的目标站要有一个活着才算可用
          # 判不准（403/429/超时/跑测机网络受限）一律按无效剔除，单列在「测不准剔除」。
          DEEP_CHECK: "1"
          DEEP_CHECK_CATEGORIES: "cj,js,spider"
          DEEP_JAR_CLASS: "1"         # 校验「jar 里有没有这个爬虫类」
          DEEP_CHECK_WORKERS: "16"
          BUDGET_DEEP_CHECK: "600"     # 深度体检预算（秒）；到点收工，没测到的同样按无效剔除并单列
          DEEP_TARGET_TIMEOUT_MS: "8000"
          DEEP_MAX_TARGETS: "3"
          # ---- 点播：只收录快站 ----
          VOD_ONLY_FAST: "1"          # 输出只留 TTFB≤FAST_TTFB_MS 的站；其余进剔除报告，池子保留下轮重测
          # ---- 直播：只剔不合，不做频道合并 ----
          LIVE_PROBE_CHANNELS: "3"    # 每个直播源随机抽查几个频道，全失败剔除整个源
          LIVE_PROBE_TIMEOUT_MS: "6000"
          LIVE_PROBE_WORKERS: "12"
          BUDGET_LIVE_PROBE: "300"    # 抽查阶段预算（秒）；预算用尽没抽到的源按无效剔除并单列
          # ---- 保留策略：产物/统计只留最近 30 天 ----
          # 产物是每天覆盖重写的（聚合接口/ 永远只有最新一份）；
          # 这里控制的是会累积的东西：历史统计、候选池。
          HISTORY_KEEP_DAYS: "30"
          POOL_KEEP_DAYS: "30"
          # ---- 其它 ----
          DROP_LOCAL_REF: "1"         # 去掉 127.0.0.1 本地引用
          KEEP_SOURCE_SUFFIX: "0"     # 名字不再加「｜来源」
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '600' }}
          # ---- 分阶段预算（秒）：到点收工，绝不把任务拖超时 ----
          # 预算用尽没测到的站按无效剔除（见 KEEP_UNPROBED）；历届线上 budget 跳过恒为 0，
          # 探活是最慢的一步（每个站要测 2 轮），给足 26 分钟。
          BUDGET_FETCH: "900"
          # 探活 1560 + 深度体检 600 = 36 分钟，仍在 60 分钟作业上限内（抓取/直播另有预算）
          BUDGET_PROBE: "1560"
          BUDGET_LIVE: "600"
          FETCH_WORKERS: "8"
          PROBE_WORKERS: "24"
          LIVE_WORKERS: "8"
          # CI 里不用缓存（每次都是干净环境）
          CACHE_DIR: ""
          # GitHub 仓库搜索用（自动注入，无需你配置）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_CANDIDATES_PER_REPO: "6"
          GH_SEARCH_MAX_AGE_DAYS: "30"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_collect }}" = "true" ]; then ARGS="--no-collect"; fi
          echo "运行参数: $ARGS"
          node scripts/main.mjs $ARGS

      - name: 提交产物
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ===== 为什么不用 git pull --rebase --autostash =====
          # 产物是整份重写的，rebase 必然冲突；--autostash 会把冲突标记
          # （<<<<<<< Updated upstream）弹回工作区，加上 "|| true" 吞掉错误，
          # 接着 git add 就把损坏内容提交了 → 线上产物全部报废（真实发生过）。
          #
          # ===== 现在的做法 =====
          # 1) 把本轮产物拷到临时目录（只拷产物，不碰累积数据）
          # 2) 干净地同步到远端最新
          # 3) 把本轮产物覆盖回去
          # 这样永远不进入冲突路径，也不会冲掉 pool/history 的累积内容。
          # 本轮生成的所有结果都先存起来（产物 + 累积数据）
          STAGE=$(mktemp -d)
          cp -r 聚合接口 "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/README.md" 2>/dev/null || true
          cp data/pool.json "$STAGE/pool.json" 2>/dev/null || true
          cp data/history.json "$STAGE/history.json" 2>/dev/null || true

          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD

          rm -rf 聚合接口
          cp -r "$STAGE/聚合接口" ./ 2>/dev/null || true
          cp "$STAGE/README.md" README.md 2>/dev/null || true
          # 累积数据：本轮的版本已经是"远端旧内容 + 本轮新增"，所以用它覆盖是对的
          cp "$STAGE/pool.json" data/pool.json 2>/dev/null || true
          cp "$STAGE/history.json" data/history.json 2>/dev/null || true
          rm -rf "$STAGE"

          # ===== 提交前闸门 =====
          if grep -rqE "^(<<<<<<< |=======$|>>>>>>> )" 聚合接口/ README.md 2>/dev/null; then
            echo "❌ 产物里有冲突标记，拒绝提交"
            exit 1
          fi
          for f in 聚合接口/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              || { echo "❌ $f 不是合法 JSON，拒绝提交"; exit 1; }
          done
          echo "✅ 产物校验通过（无冲突标记、JSON 合法）"

          # README.md 也要加：脚本会把站点数量回写进去（否则数量永远停在旧值）
          git add 聚合接口/ data/pool.json data/history.json README.md
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "chore: 自动更新聚合接口 [$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')] [skip ci]"
            git push
          fi

      # 产物检查：确认只留一份最新产物，且没有把调试缓存/过期文件带进仓库
      - name: 产物检查
        if: always()
        run: |
          echo "=== 聚合接口/（每天覆盖，永远只有最新一份）==="
          ls -la 聚合接口/ 2>/dev/null || echo "⚠️ 目录不存在"
          echo "=== 保留策略：只应有最近 30 天的统计与池子 ==="
          ls -la data/ 2>/dev/null || true
          if [ -d data/cache ]; then
            echo "⚠️ data/cache 存在（本地调试缓存，不应入库）"
            git status --porcelain data/cache || true
          fi
          # 产物若超过 7 天没更新，说明定时任务可能没跑
          if [ -f 聚合接口/README.md ]; then
            AGE=$(( ( $(date +%s) - $(date -r 聚合接口/README.md +%s) ) / 86400 ))
            echo "产物年龄：${AGE} 天"
            [ "$AGE" -gt 7 ] && echo "⚠️ 产物已超过 7 天未更新，请检查定时任务" || echo "✅ 产物新鲜"
          fi
